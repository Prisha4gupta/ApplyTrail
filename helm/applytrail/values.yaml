image:
  repository: ghcr.io/prisha4gupta/applytrail
  tag: local
imagePullSecrets: []
frontend:
  replicas: 2
backend:
  replicas: 2
  autoscaling:
    enabled: true
    maxReplicas: 5
    targetCPU: 65
postgres:
  image: postgres:17.6-alpine
  storage: 10Gi
  storageClass: gp3
  existingSecret: applytrail-db
  # Secret keys: DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
migration:
  enabled: true
ingress:
  enabled: true
  className: traefik
  host: ''
monitoring:
  enabled: false
  release: monitoring
