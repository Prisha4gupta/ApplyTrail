deployment:
  replicas: 2
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
ingressClass:
  enabled: true
  isDefaultClass: false
providers:
  kubernetesIngress:
    enabled: true
ingressRoute:
  dashboard: {enabled: false}
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
